
tags:
  - Contacts
summary: Update contact by id
operationId: patchContact
description: 'Update contact by id'
security:
  - bearerAuth: []
parameters:
  - in: path
    name: id
    required: true
    schema:
      type: string
      example: '65ca67e7ae7f10c88b598384'

requestBody:
  content:
    multipart/form-data:
      schema:
        type: object
       
          
        properties:
          name:
            description: "Contacts's name"
            type: string
            example: 'John Doe'
          phoneNumber:
            description: "Contacts's phone number"
            type: string
            example: '+380961235622'
          email:
            description: "Contacts's email address"
            type: string
            example: 'example@mail.com'
          isFavourite:
            description: "Contacts's favorite status"
            type: boolean
            example: false
          contactType: 
              description: "Type of contact (e.g., work, home, personal)"
              type: string
              enum: ['work', 'home', 'personal']
              example: 'work'  
          photo: 
            description: "Link to contacts's photo"
            type: string
            format: binary      
responses:
  '200':
    description: 'Update contact by id'
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully patched a contact!
            data:
              type: object
              $ref: ../../../components/schemas/contact.yaml
  '401':
    $ref: '../../../components/responses/401.yaml'

