type: object
required:
  - _id
  - name
  - phoneNumber
  - contactType
  
properties:
  _id:
    description: "Contacts's id"
    type: string
    example: 65e4decdd286b30065d54af9
  name:
    description: "Contacts's name"
    type: string
    example: 'John Doe'
  phoneNumber:
    description: "Contacts's phone number"
    type: string
    example: '+380961235622'
  email:
    description: "Contacts's email address"
    type: string
    example: 'example@mail.com'
  isFavourite:
    description: "Contacts's favorite status"
    type: boolean
    example: false
  contactType: 
    description: "Contacts's name"
    type: string
    enum: ['work', 'home', 'personal']
    example: 'work'  
  photo: 
   description: "Link to contacts's photo"
   type: string
   example: https://res.cloudinary.com/uqwgdu/image/upload/image.png





    